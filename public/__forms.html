<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Netlify Forms Detection Skeleton</title>
</head>
<body>
  <!-- Existing product inquiry form -->
  <form name="product-inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="product-inquiry" />
    <input type="text" name="bot-field" />
    <input type="text" name="product" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="contactMethod" />
  </form>

  <!-- Journey Christian School Christmas Order Form -->
  <form name="journey-christmas-order" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="journey-christmas-order" />
    <input type="text" name="bot-field" />
    <input type="text" name="name" />
    <input type="tel" name="phone" />
    <input type="email" name="email" />
    <input type="text" name="studentGrade" />
    <textarea name="orderSummary"></textarea>
    <input type="text" name="ornamentNames" />
    <textarea name="customIdea"></textarea>
    <input type="text" name="familyName" />
    <input type="text" name="neededBy" />
    <input type="text" name="bibleVerse" />
    <input type="text" name="delivery" />
    <input type="text" name="payment" />
    <input type="text" name="subtotal" />
    <input type="text" name="engravingFee" />
    <input type="text" name="discount" />
    <input type="text" name="tax" />
    <input type="text" name="total" />
    <input type="text" name="schoolDonation" />
  </form>
</body>
</html>
